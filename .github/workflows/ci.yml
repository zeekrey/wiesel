name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.x']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
