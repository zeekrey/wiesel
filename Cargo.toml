[package]
name = "wiesel"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "f8c2cc844057540ca1eac7de4f19f50d7597dead" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "f8c2cc844057540ca1eac7de4f19f50d7597dead", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
zeroize = { version = "1", features = ["serde"] }
global-hotkey = "0.7"
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "f8c2cc844057540ca1eac7de4f19f50d7597dead", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSAccessibility", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem"] }
